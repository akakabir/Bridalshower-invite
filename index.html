<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>You're Invited — Bridal Shower</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { overscroll-behavior:none; -webkit-overflow-scrolling:touch; }
  body {
    font-family:'Playfair Display', Georgia, serif;
    background:#1c0710;
    overflow-x:hidden;
    color:#f5e6d3;
  }
  ::-webkit-scrollbar{display:none}
  body{-ms-overflow-style:none;scrollbar-width:none}

  .scroll-runway { height:420vh; }

  /* ═══ Fixed viewport ═══ */
  .viewport {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(90,8,28,0.5) 0%, transparent 65%),
      #1c0710;
  }

  /* ═══ Sparkles ═══ */
  .sparkles { position:absolute; inset:0; pointer-events:none; z-index:0; }
  .sparkle {
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, rgba(212,175,55,0.7), transparent 70%);
    animation:sparkFloat linear infinite;
  }
  @keyframes sparkFloat {
    0%  { transform:translateY(0) scale(0); opacity:0; }
    15% { opacity:0.8; transform:translateY(-15vh) scale(1); }
    85% { opacity:0.4; }
    100%{ transform:translateY(-95vh) scale(0.2); opacity:0; }
  }

  /* ═══ Hero ═══ */
  .hero {
    position:absolute; top:7vh; left:0; right:0;
    text-align:center; z-index:10; pointer-events:none;
  }
  .hero h1 {
    font-family:'Great Vibes', cursive;
    font-size:clamp(2rem,8vw,3.2rem);
    color:#d4af37;
    text-shadow:0 2px 18px rgba(212,175,55,0.35);
    margin-bottom:4px;
  }
  .hero p {
    font-size:clamp(0.7rem,2.3vw,0.85rem);
    letter-spacing:0.3em; text-transform:uppercase;
    color:rgba(245,230,211,0.45);
  }

  /* ═══ Scroll hint ═══ */
  .scroll-hint {
    position:absolute; bottom:5vh; left:0; right:0;
    text-align:center; z-index:10; pointer-events:none;
  }
  .scroll-hint span {
    display:block; font-size:0.65rem;
    letter-spacing:0.3em; text-transform:uppercase;
    color:rgba(212,175,55,0.65); margin-bottom:8px;
  }
  .scroll-hint .arr {
    display:inline-block; width:16px; height:16px;
    border-right:2px solid rgba(212,175,55,0.45);
    border-bottom:2px solid rgba(212,175,55,0.45);
    transform:rotate(45deg);
    animation:arrBounce 1.5s ease-in-out infinite;
  }
  @keyframes arrBounce {
    0%,100%{transform:rotate(45deg) translate(0,0)}
    50%{transform:rotate(45deg) translate(3px,3px)}
  }

  /* ═══════════════════════════════════
       ENVELOPE — matches reference
     ═══════════════════════════════════ */
  .envelope-anchor {
    position:relative;
    width:min(85vw, 360px);
    aspect-ratio:1.5/1;
    z-index:5;
  }

  .envelope {
    position:absolute; inset:0;
    filter: drop-shadow(0 20px 50px rgba(0,0,0,0.65));
  }

  /* Back wall (cream interior) */
  .env-back {
    position:absolute; inset:0;
    background: linear-gradient(175deg, #f2e8da 0%, #e9dbc8 100%);
    border-radius:4px;
    z-index:1;
  }

  /* Front panels (4 triangular folds) */
  .env-front { position:absolute; inset:0; z-index:3; pointer-events:none; }

  .env-fold-bottom {
    position:absolute; inset:0;
    background: linear-gradient(0deg, #7a1428 0%, #6b1222 60%, #5e1020 100%);
    clip-path: polygon(0 100%, 50% 45%, 100% 100%);
  }
  .env-fold-bottom::after {
    content:''; position:absolute; inset:0;
    background: linear-gradient(0deg, rgba(255,255,255,0.03), transparent 50%);
    clip-path: polygon(0 100%, 50% 45%, 100% 100%);
    pointer-events:none;
  }
  .env-fold-left {
    position:absolute; inset:0;
    background: linear-gradient(90deg, #72152a 0%, #651222 100%);
    clip-path: polygon(0 0, 50% 45%, 0 100%);
  }
  .env-fold-right {
    position:absolute; inset:0;
    background: linear-gradient(-90deg, #72152a 0%, #651222 100%);
    clip-path: polygon(100% 0, 50% 45%, 100% 100%);
  }
  .env-fold-shadow {
    position:absolute; inset:0;
    pointer-events:none; z-index:1;
  }
  .env-fold-shadow::before {
    content:''; position:absolute; inset:0;
    background: linear-gradient(to right, transparent 48.5%, rgba(0,0,0,0.12) 49.5%, rgba(0,0,0,0.12) 50.5%, transparent 51.5%);
    clip-path: polygon(0 100%, 50% 45%, 100% 100%);
  }

  /* Flap (top — opens upward) */
  .env-flap {
    position:absolute;
    top:0; left:0; right:0;
    height:60%;
    z-index:4;
    transform-origin: top center;
    transform: rotateX(0deg);
    will-change:transform;
  }
  .env-flap-face { position:absolute; inset:0; backface-visibility:hidden; }
  .env-flap-out {
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    background: linear-gradient(180deg, #8a1e35 0%, #761a2d 40%, #691525 100%);
    z-index:2;
  }
  .env-flap-out::after {
    content:''; position:absolute; inset:0;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    background: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, transparent 35%);
    pointer-events:none;
  }
  .env-flap-in {
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    background: linear-gradient(180deg, #efe3d2 0%, #e6d6c3 100%);
    transform: rotateX(180deg);
    z-index:1;
  }

  /* Wax seal */
  .seal {
    position:absolute; left:50%; bottom:0;
    transform:translate(-50%, 50%);
    width:42px; height:42px; z-index:5;
  }
  .seal-disc {
    width:100%; height:100%; border-radius:50%;
    background:radial-gradient(circle at 36% 34%, #d44a3f, #a32a30 45%, #7b1a25 85%);
    box-shadow:
      0 3px 10px rgba(0,0,0,0.5),
      inset 0 2px 3px rgba(255,255,255,0.2),
      inset 0 -2px 3px rgba(0,0,0,0.25);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; color:rgba(212,175,55,0.9);
    text-shadow:0 1px 2px rgba(0,0,0,0.3);
  }

  /* ═══ LETTER — separate from envelope! ═══ */
  .letter {
    position:absolute;
    /* matches envelope inner area */
    left:5%; right:5%; top:5%; bottom:5%;
    background:#000;
    border-radius:3px;
    z-index:2; /* behind front panels initially */
    overflow:hidden;
    will-change:transform;
  }
  .letter video {
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
  }

  /* Fullscreen video */
  .letter.fullscreen {
    position:fixed !important;
    inset:0 !important;
    left:0 !important; right:0 !important;
    top:0 !important; bottom:0 !important;
    width:100vw !important;
    height:100vh !important;
    border-radius:0 !important;
    z-index:999 !important;
    transition:all 0.6s cubic-bezier(0.4,0,0.2,1);
  }

  /* Tap-to-play overlay */
  .play-overlay {
    position:absolute; inset:0;
    background:rgba(28,7,16,0.6);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    z-index:1000; cursor:pointer;
    opacity:0; pointer-events:none;
    transition:opacity 0.4s ease;
    backdrop-filter:blur(3px);
  }
  .play-overlay.show { opacity:1; pointer-events:auto; }
  .play-btn {
    width:60px; height:60px;
    border:2px solid rgba(212,175,55,0.65);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(120,20,40,0.25);
    margin-bottom:10px;
    animation:pBtn 2s ease-in-out infinite;
  }
  .play-btn::after {
    content:''; display:block;
    border-left:18px solid #d4af37;
    border-top:11px solid transparent;
    border-bottom:11px solid transparent;
    margin-left:4px;
  }
  .play-overlay span {
    font-size:0.7rem; letter-spacing:0.22em;
    text-transform:uppercase; color:#d4af37;
  }
  @keyframes pBtn {
    0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,0.3)}
    50%{box-shadow:0 0 0 12px rgba(212,175,55,0)}
  }
</style>
</head>
<body>

<div class="scroll-runway"></div>

<div class="viewport" id="vp">
  <div class="sparkles" id="sparkles"></div>

  <div class="hero" id="hero">
    <h1>You're Invited</h1>
    <p>Bridal Shower</p>
  </div>

  <div class="scroll-hint" id="hint">
    <span>Scroll to Open</span>
    <div class="arr"></div>
  </div>

  <!-- Anchor holds both envelope + letter as siblings -->
  <div class="envelope-anchor" id="anchor">

    <!-- ENVELOPE (purely visual — no video inside) -->
    <div class="envelope" id="envelope">
      <div class="env-back"></div>
      <div class="env-front" id="envFront">
        <div class="env-fold-left"></div>
        <div class="env-fold-right"></div>
        <div class="env-fold-bottom"></div>
        <div class="env-fold-shadow"></div>
      </div>
      <div class="env-flap" id="flap">
        <div class="env-flap-face env-flap-out"></div>
        <div class="env-flap-face env-flap-in"></div>
        <div class="seal" id="seal">
          <div class="seal-disc">♥</div>
        </div>
      </div>
    </div>

    <!-- LETTER with VIDEO — sibling of envelope, NOT inside it -->
    <div class="letter" id="letter">
      <video id="vid" preload="auto" loop muted playsinline webkit-playsinline>
        <source src="invitation.mp4" type="video/mp4">
      </video>
      <div class="play-overlay" id="playOv">
        <div class="play-btn"></div>
        <span>Tap to Play with Sound</span>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const hero=$('hero'), hint=$('hint'), flap=$('flap'),
        envFront=$('envFront'), seal=$('seal'), letter=$('letter'),
        envelope=$('envelope'), vid=$('vid'), playOv=$('playOv'),
        sparkles=$('sparkles'), anchor=$('anchor');

  let playing=false, gone=false;

  // Sparkles
  for(let i=0;i<14;i++){
    const s=document.createElement('div');
    s.className='sparkle';
    s.style.left=(5+Math.random()*90)+'%';
    s.style.top=(55+Math.random()*45)+'%';
    s.style.width=s.style.height=(2+Math.random()*3)+'px';
    s.style.animationDuration=(7+Math.random()*7)+'s';
    s.style.animationDelay=(Math.random()*10)+'s';
    sparkles.appendChild(s);
  }

  function progress(){
    const y=window.scrollY;
    const max=document.documentElement.scrollHeight-window.innerHeight;
    return max>0?Math.min(1,Math.max(0,y/max)):0;
  }
  function remap(v,a,b,c,d){
    return c+(d-c)*Math.max(0,Math.min(1,(v-a)/(b-a)));
  }
  function easeOut(t){return 1-Math.pow(1-t,3);}

  function update(){
    const p=progress();

    // ── Hint disappears very fast (first ~2% = ~10 scroll lines) ──
    hint.style.opacity=remap(p,0,0.02,1,0);

    // ── Hero fade ──
    hero.style.opacity=remap(p,0.01,0.08,1,0);
    hero.style.transform='translateY('+remap(p,0.01,0.08,0,-20)+'px)';

    // ── Seal breaks off ──
    seal.style.opacity=remap(p,0,0.07,1,0);
    seal.style.transform='translate(-50%,50%) scale('+remap(p,0,0.07,1,0.2)+') translateY('+remap(p,0,0.07,0,25)+'px)';

    // ── Flap opens (5%→38%) ──
    if(p<0.05){
      flap.style.transform='rotateX(0deg)';
    } else if(p<=0.38){
      var t=easeOut(remap(p,0.05,0.38,0,1));
      flap.style.transform='rotateX('+t*180+'deg)';
    } else {
      flap.style.transform='rotateX(180deg)';
    }

    // ── Front panels fade to reveal card (32%→52%) ──
    envFront.style.opacity=remap(p,0.32,0.52,1,0);

    // ── Card rises up out of envelope (38%→62%) ──
    if(p<0.38){
      letter.style.transform='translateY(0)';
      letter.style.zIndex='2';
    } else if(p<=0.62){
      letter.style.transform='translateY('+remap(p,0.38,0.62,0,-115)+'%)';
      letter.style.zIndex='10'; // above envelope now
    }

    // ── Envelope fades out (58%→70%) ──
    envelope.style.opacity=remap(p,0.58,0.70,1,0);

    // ── Fullscreen + play video (72%+) ──
    if(p>=0.72 && !gone){
      gone=true;
      envelope.style.visibility='hidden';
      sparkles.style.transition='opacity 0.5s';
      sparkles.style.opacity='0';
      letter.classList.add('fullscreen');
      startVid();
    }
    if(p<0.72 && gone){
      gone=false;
      envelope.style.visibility='visible';
      envelope.style.opacity='1';
      sparkles.style.opacity='1';
      letter.classList.remove('fullscreen');
      letter.style.transform='';
      letter.style.zIndex='2';
      stopVid();
    }
  }

  function startVid(){
    if(playing) return;
    playing=true;
    vid.muted=false;
    var pr=vid.play();
    if(pr) pr.then(function(){
      // audio works fine
    }).catch(function(){
      // audio blocked on mobile, play muted + show tap button
      vid.muted=true;
      vid.play();
      playOv.classList.add('show');
    });
  }

  function stopVid(){
    playing=false;
    vid.pause();
    vid.currentTime=0;
    vid.muted=true;
    playOv.classList.remove('show');
  }

  playOv.addEventListener('click',function(e){
    e.stopPropagation();
    vid.muted=false;
    vid.play().then(function(){
      playOv.classList.remove('show');
    }).catch(function(){
      vid.muted=true;
      vid.play();
      playOv.classList.remove('show');
    });
  });

  var ticking=false;
  function onScroll(){
    if(!ticking){
      ticking=true;
      requestAnimationFrame(function(){
        update();
        ticking=false;
      });
    }
  }
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('touchmove',onScroll,{passive:true});

  // Initial render
  update();
})();
</script>
</body>
</html>
